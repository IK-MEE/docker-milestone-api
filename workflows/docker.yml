name: Build and Push Docker Image

# ── When does this pipeline run? ─────────────────
on:
  push:
    branches:
      - main        # runs every time you push to main branch

# ── What does it do? ─────────────────────────────
jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest    # GitHub provides this Linux machine

    steps:

      # Step 1: Download your code onto the GitHub machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log into Docker Hub using your secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Set up Docker Buildx (advanced builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build and push the image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-milestone-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-milestone-api:${{ github.sha }}
          cache-from: type=gha    # use GitHub's cache for faster builds
          cache-to: type=gha,mode=max

      # Step 5: Confirm what was pushed
      - name: Summary
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/docker-milestone-api:latest"
          echo "🔖 SHA tag: ${{ secrets.DOCKERHUB_USERNAME }}/docker-milestone-api:${{ github.sha }}"